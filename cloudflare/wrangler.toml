name = "kiro-passport-relay"
main = "src/index.ts"
compatibility_date = "2026-08-23"

[vars]
ADMIN_UI_USERNAME = "yanyun"
# Info-wallpaper weather location (Open-Meteo); change lat/lon via env vars if needed.
WALLPAPER_CITY = "Shanghai"
# Voice-assistant AI: OpenAI-compatible gateway endpoint + default model.
AI_BASE_URL = "https://grok.yanyun.asia/v1"
AI_MODEL = "grok-chat-fast"
# ASR recognition language (ISO-639-1); Whisper defaults to Chinese here.
AI_ASR_LANGUAGE = "zh"
# Voice-assistant system prompt preset. Override here or via an env var; leave
# empty to use the built-in concise default in src/voice.ts (AI_SYSTEM_PROMPT).
AI_SYSTEM_PROMPT = "你是一个内置在智能语音护照设备里的中文语音助手，名字叫「跃云」。请用中文回答，语气简洁、可靠、略带温度。回答尽量简洁但完整；除非用户明确要求，否则不要使用标题、列表、Markdown 或换行。若用户询问设备状态、时间或出行信息，给出清楚直接的回答；"
# TTS: Edge TTS proxy Worker (OpenAI-compatible /v1/audio/speech).
# TTS_API_KEY must be set as a secret, shared with the edgetts-proxy Worker.
TTS_BASE_URL = "https://tts.yanyun.asia/v1"
TTS_VOICE = "zh-CN-XiaoxiaoNeural"

[triggers]
# Push the generated info wallpaper to all active devices hourly.
crons = ["0 * * * *"]

# Workers AI: Whisper ASR for the voice assistant module.
[ai]
binding = "AI"

# Before the first remote deployment, replace this placeholder with the ID printed by:
#   npx wrangler d1 create kiro-passport
[[d1_databases]]
binding = "DB"
database_name = "kiro-passport"
database_id = "ebc29622-5e24-4af8-be5c-23448bf439b5"

[[durable_objects.bindings]]
name = "PASSPORTS"
class_name = "PassportRelay"

# Legacy DO migrations remain supported. Do not change the tag after deploying it.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PassportRelay"]

# The parent zone must be onboarded to Cloudflare. This creates the Worker custom domain.
[[routes]]
pattern = "ws.yanyun.asia"
custom_domain = true
