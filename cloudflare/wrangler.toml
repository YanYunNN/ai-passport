name = "kiro-passport-relay"
main = "src/index.ts"
compatibility_date = "2026-08-23"

[vars]
ADMIN_UI_USERNAME = "yanyun"
# Info-wallpaper weather location (Open-Meteo); change lat/lon via env vars if needed.
WALLPAPER_CITY = "Shanghai"

[triggers]
# Push the generated info wallpaper to all active devices hourly.
crons = ["0 * * * *"]

# Before the first remote deployment, replace this placeholder with the ID printed by:
#   npx wrangler d1 create kiro-passport
[[d1_databases]]
binding = "DB"
database_name = "kiro-passport"
database_id = "ebc29622-5e24-4af8-be5c-23448bf439b5"

[[durable_objects.bindings]]
name = "PASSPORTS"
class_name = "PassportRelay"

# Legacy DO migrations remain supported. Do not change the tag after deploying it.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PassportRelay"]

# The parent zone must be onboarded to Cloudflare. This creates the Worker custom domain.
[[routes]]
pattern = "ws.yanyun.asia"
custom_domain = true
